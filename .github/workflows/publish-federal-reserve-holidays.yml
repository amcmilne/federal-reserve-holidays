name: Publish Federal Reserve Holidays

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint package
        run: npm run lint -w @bank/federal-reserve-holidays

      - name: Test package
        run: npm run test -w @bank/federal-reserve-holidays

      - name: Build package
        run: npm run build -w @bank/federal-reserve-holidays

      - name: Preview publish contents
        working-directory: packages/federal-reserve-holidays
        run: npm pack --dry-run

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: Release Federal Reserve Holidays
          commit: Release Federal Reserve Holidays
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
